server:
  port: 8101

anomaly:
  collector:
    source: datadog                           # datadog | replay
    replay-dir: recordings/my-run             # only for source: replay (a folder written by recording)
    # The Datadog accounts to watch, one entry per site, all collected at the same time, each in its own lane (its
    # own rate limit, 429 wait, calls in flight and breakers). Keys are given by the NAME of the variable in .env,
    # never by value; only DD_<NAME>_API_KEY / DD_<NAME>_APP_KEY names are accepted.
    sources:
__SOURCES__
    #  - name: eu                             #   example: a second region (add its keys to .env, restart the Collector)
    #    site: datadoghq.eu                   #   datadoghq.com (US1), datadoghq.eu, us3/us5/ap1/ap2.datadoghq.com, ddog-gov.com
    #    api-key-env: DD_EU_API_KEY
    #    app-key-env: DD_EU_APP_KEY
    #    dashboards:                          #   exported JSON files in config-repo/dashboards/<source>/
    #      - file: dashboards/eu/shop.json    #   Datadog: dashboard > Share > Export dashboard JSON
    #        id: stu-vwx-yz1                  #   optional: for links, when the file has no id (from its URL)
    #        presets: all                     #   optional: every saved view, each as its own view; or [Name1, Name2]
    #        filters: { env: prod }           #   optional: wins over the file's default for that variable
    #    max-concurrent-requests: 4           #   optional, else the shared value below
    poll-interval: 15s                        # how often to ask for new data
    step: 10s                                 # size of each data step (highest value per step)
    backfill: 10m                             # how much history to fetch at start
    recent-window: 2m                         # how much to fetch on each later poll
    dashboard-refresh: 60m                    # how often to re-read dashboard definitions

    # --- everything below is read live; no code change needed ---
    classification:                           # kind and unit of a line; first match wins; otherwise Datadog's metric metadata
      - match: { has-formula: true, panel-title: "*Success Rate*" }
        set: { kind: ratio, unit: percent }
    #  - match: { metric: "myapp.*.latency" }  #   example: your own metric names
    #    set: { kind: latency, unit: ms }
    max-concurrent-requests: 8                # bulkhead: calls to Datadog at the same time, per source
    batch-formulas: 40                        # panels share one Datadog call, up to this many formulas (1 = no sharing)
    rate-limit-share: 0.8                     # use 80% of the limit each Datadog account reports
    retries: 3
    retry-base: 500ms                         # waits grow 0.5s, 1s, 2s... (random, capped)
    retry-cap: 8s
    breaker-failures: 5                       # a panel failing 5 times in a row is paused...
    breaker-open: 5m                          # ...for 5 minutes, then tried once
    metadata-ttl: 24h                         # how long Datadog's type/unit of a metric is trusted
    metadata-cache-size: 10000
    recording:
      enabled: false                          # save every answer to files (for replay tests)
      dir: recordings
