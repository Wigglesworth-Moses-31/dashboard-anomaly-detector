server:
  port: 8105

anomaly:
  reporter:
    window: 24h                               # 1h 2h 3h 4h 6h 8h 12h or 24h, from midnight; never more than a day
    grace: 2m                                 # wait after a window ends before reporting it
    keep-before-end: 1h                       # raw points kept before the window's end (the Store keeps the last 3h anyway)
    catch-up: 2d                              # missed windows reported this far back (at most 2d: what is still kept)
    output-dir: reports                       # the reports and .state.json
    keep-reports: 30                          # report files kept, oldest removed first
    store-address: localhost:9102             # the Store's gRPC
# The time zone (where midnight is, and the times in the report) is shared: application.yml anomaly.shared.time-zone
