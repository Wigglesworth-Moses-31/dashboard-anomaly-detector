# Shared by every service.
spring:
  kafka:
    bootstrap-servers: localhost:59092      # platform Kafka (docs/platform.md)

management:
  endpoints:
    web:
      exposure:
        include: health,settings,info
  endpoint:
    health:
      show-details: always
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN
        http-mapping:
          DEGRADED: 200                       # degraded means "running on the last good settings"

anomaly:
  shared:
    time-zone: __TIME_ZONE__                  # which day is "today" on the page and in a daily report (UTC unless set)
    display-time-zones: [UTC, Asia/Kolkata, America/New_York]   # every time is shown in these, the first is the main one
    environment: lab
