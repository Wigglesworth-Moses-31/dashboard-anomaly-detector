server:
  port: 8102

spring:
  grpc:
    server:
      port: ${anomaly.store.grpc-port}      # one place to set it: anomaly.store.grpc-port
  datasource:
    url: jdbc:postgresql://localhost:55432/anomaly?reWriteBatchedInserts=true
    username: anomaly
    password: ${PLATFORM_DB_PASSWORD}       # from the environment (scripts/system.sh), never written here
  flyway:
    schemas: metrics                        # tables and Flyway's own history live in schema metrics
    create-schemas: false                   # the schema is made by platform/init-db

anomaly:
  store:
    grpc-port: 9102
    # --- add-store, keep-one-day (24 hours kept by default, at most 10 days; raw values compressed after 6 hours) ---
    raw-safety-limit: 1d                      # raw 10-second points kept (compressed after 6 hours), at most 10d
    summary-retention: 1d                     # per-minute summaries kept, at most 10d
    max-batch-records: 500                    # records per poll and per database write
    poll-timeout: 200ms
    history-max-range: 1d                     # longest window one question may ask
    max-database-size: 10GB                   # above this the Store's health is DEGRADED (size alarm)
    size-check-interval: 1m
