// Questions other services ask the Store over gRPC (design C5). Long answers come back in chunks.
syntax = "proto3";

package lab.anomaly.v1;

import "lab/anomaly/v1/metric_points.proto";
import "lab/anomaly/v1/metric_series.proto";

option java_package = "lab.anomaly.contracts.v1";
option java_multiple_files = true;
option java_outer_classname = "StoreServiceProto";

service StoreService {
  rpc Ping (PingRequest) returns (PingReply);
  // Points of one line between two times, oldest first, at most 1000 points per chunk.
  rpc GetHistory (HistoryRequest) returns (stream HistoryChunk);
  // One summary per metric line for one local day (was used by the Reporter; unused since remove-reporter).
  rpc GetDaySummary (DaySummaryRequest) returns (stream SeriesDaySummary);
  // One summary per metric line for any time window, e.g. the last 6 hours (added by add-store, option A).
  rpc GetSummary (SummaryRequest) returns (stream SeriesSummary);
  // Removes raw points older than a time, never newer than 3 hours ago (added by add-reporter, design R6; unused
  // since remove-reporter: the Store's own raw-safety-limit removes old raw points).
  rpc RemoveRawBefore (RemoveRawRequest) returns (RemoveRawReply);
  // Every metric line the Store knows, with its full description (added by add-dashboard-view, design D1).
  rpc ListSeries (ListSeriesRequest) returns (stream SeriesDescriptor);
  // Points of many lines (at most 1000) over one range, each chunk naming its line (add-dashboard-view, design D1).
  // At MINUTE resolution each minute gives two points: its lowest value at the minute and its highest 30 s later.
  rpc GetHistoryBatch (HistoryBatchRequest) returns (stream HistoryChunk);
  // The newest saved time of every line with values in the last 25 hours (added by redesign-dashboard, design R1):
  // the Collector catches up the gap since then at start.
  rpc GetNewest (NewestRequest) returns (stream SeriesNewest);
}

message ListSeriesRequest {}

message HistoryBatchRequest {
  repeated string series_ids = 1;
  int64 from_ms = 2;                    // inclusive, UTC milliseconds
  int64 to_ms = 3;                      // exclusive, UTC milliseconds
  Resolution resolution = 4;
  int64 interval_ms = 5;                // added in add-datadog-look: roll raw values up to this interval (0 = as stored)
  Rollup method = 6;                    // how each interval is rolled up (unspecified = average)
}

// add-datadog-look: Datadog's rollup methods; one value per interval
enum Rollup {
  ROLLUP_UNSPECIFIED = 0;
  ROLLUP_AVG = 1;
  ROLLUP_SUM = 2;
  ROLLUP_MIN = 3;
  ROLLUP_MAX = 4;
}

message RemoveRawRequest {
  int64 before_ms = 1;                  // UTC milliseconds; a time in the future is refused
}

message RemoveRawReply {
  int64 removed_points = 1;
  int64 effective_before_ms = 2;        // the time actually used: min(before_ms, now - 3 hours)
}

message PingRequest {}

message PingReply {
  string service = 1;
  int64 time_ms = 2;
}

message HistoryRequest {
  string series_id = 1;
  int64 from_ms = 2;                    // inclusive, UTC milliseconds
  int64 to_ms = 3;                      // exclusive, UTC milliseconds
  Resolution resolution = 4;
}

enum Resolution {
  RESOLUTION_UNSPECIFIED = 0;
  RESOLUTION_RAW = 1;                   // the 10-second steps
  RESOLUTION_MINUTE = 2;                // per-minute summaries
}

message HistoryChunk {
  string series_id = 1;
  repeated Point points = 2;
}

message DaySummaryRequest {
  string date = 1;                      // e.g. "2026-11-15"
  string time_zone = 2;                 // e.g. "Asia/Kolkata"
}

message SeriesDaySummary {
  string series_id = 1;
  int64 count = 2;
  double min = 3;
  double max = 4;
  double mean = 5;
  double p95 = 6;                       // approximate when built from per-minute summaries
}

message SummaryRequest {
  int64 from_ms = 1;                    // inclusive, UTC milliseconds
  int64 to_ms = 2;                      // exclusive, UTC milliseconds
}

message SeriesSummary {
  string series_id = 1;
  int64 count = 2;
  double min = 3;
  double max = 4;
  double mean = 5;
  double p95 = 6;                       // exact (computed over the raw points of the window)
  int64 from_ms = 7;
  int64 to_ms = 8;
}

message NewestRequest {}

message SeriesNewest {
  string series_id = 1;
  int64 newest_ms = 2;                  // UTC milliseconds of the line's newest saved value
}
