// Questions other services ask the Store over gRPC (design C5). Long answers come back in chunks.
syntax = "proto3";

package lab.anomaly.v1;

import "lab/anomaly/v1/metric_points.proto";

option java_package = "lab.anomaly.contracts.v1";
option java_multiple_files = true;
option java_outer_classname = "StoreServiceProto";

service StoreService {
  rpc Ping (PingRequest) returns (PingReply);
  // Points of one line between two times, oldest first, at most 1000 points per chunk.
  rpc GetHistory (HistoryRequest) returns (stream HistoryChunk);
  // One summary per metric line for one local day (used by the Reporter).
  rpc GetDaySummary (DaySummaryRequest) returns (stream SeriesDaySummary);
  // One summary per metric line for any time window, e.g. the last 6 hours (added by add-store, option A).
  rpc GetSummary (SummaryRequest) returns (stream SeriesSummary);
  // Removes raw points older than a time, never newer than 3 hours ago (added by add-reporter, design R6).
  rpc RemoveRawBefore (RemoveRawRequest) returns (RemoveRawReply);
}

message RemoveRawRequest {
  int64 before_ms = 1;                  // UTC milliseconds; a time in the future is refused
}

message RemoveRawReply {
  int64 removed_points = 1;
  int64 effective_before_ms = 2;        // the time actually used: min(before_ms, now - 3 hours)
}

message PingRequest {}

message PingReply {
  string service = 1;
  int64 time_ms = 2;
}

message HistoryRequest {
  string series_id = 1;
  int64 from_ms = 2;                    // inclusive, UTC milliseconds
  int64 to_ms = 3;                      // exclusive, UTC milliseconds
  Resolution resolution = 4;
}

enum Resolution {
  RESOLUTION_UNSPECIFIED = 0;
  RESOLUTION_RAW = 1;                   // the 10-second steps
  RESOLUTION_MINUTE = 2;                // per-minute summaries
}

message HistoryChunk {
  string series_id = 1;
  repeated Point points = 2;
}

message DaySummaryRequest {
  string date = 1;                      // e.g. "2026-11-15"
  string time_zone = 2;                 // e.g. "Asia/Kolkata"
}

message SeriesDaySummary {
  string series_id = 1;
  int64 count = 2;
  double min = 3;
  double max = 4;
  double mean = 5;
  double p95 = 6;                       // approximate when built from per-minute summaries
}

message SummaryRequest {
  int64 from_ms = 1;                    // inclusive, UTC milliseconds
  int64 to_ms = 2;                      // exclusive, UTC milliseconds
}

message SeriesSummary {
  string series_id = 1;
  int64 count = 2;
  double min = 3;
  double max = 4;
  double mean = 5;
  double p95 = 6;                       // exact (computed over the raw points of the window)
  int64 from_ms = 7;
  int64 to_ms = 8;
}
