<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live dashboards</title>
  <link rel="stylesheet" href="app.css">
  <script src="vendor/echarts.min.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="settings.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot-logo"></span>Live dashboards</div>
    <nav class="tabs" id="tabs" aria-label="Regions">
      <a href="#settings" id="tabSettings" class="tab">Settings</a>
    </nav>
    <button id="attention" class="attention" type="button" aria-expanded="false">● 0 open · 0 need a reason</button>
    <div class="conn" id="conn"><span class="pill" id="connPill">connecting</span><span id="lastChange" class="muted"></span></div>
    <div class="toggles">
      <button id="notifyBtn" class="toggle" title="Desktop notification when a new anomaly opens">🔔 off</button>
      <button id="soundBtn" class="toggle" title="Short sound when a new anomaly opens">🔊 off</button>
    </div>
  </header>
  <div id="attentionList" class="attention-list" hidden></div>
  <main id="incidentsView"></main>
  <main id="settingsView" hidden>
    <section>
      <h2>Regions <span class="count" id="sCount"></span></h2>
      <p class="muted">Datadog regions to watch (at most two: US and EU) and their dashboards. Every change is one commit in
        <code>config-repo</code>; keys go only to <code>.env</code> on this machine and are never shown again.</p>
      <div id="sNotice" class="s-notice" hidden></div>
      <div id="sRegions" class="list"></div>
      <div id="sAdd"></div>
    </section>
  </main>
</body>
</html>
